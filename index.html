<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#170f24">
  <title>Un hommage de tes amies</title>
  <meta name="description" content="Un hommage de la part de tes amies : souvenirs, vidéos et mots du cœur.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Hanken+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="splashing">

  <!-- Écran d'entrée -->
  <div class="splash" id="splash">
    <div class="splash-inner">
      <p class="splash-name" id="splashName"></p>
      <p class="splash-line" id="splashLine"></p>
      <button class="btn primary splash-btn" id="enter" type="button"></button>
    </div>
  </div>

  <!-- Navigation -->
  <header class="nav" id="nav">
    <a class="brand" href="#top" id="brand"></a>
    <nav aria-label="Sections">
      <a href="#souvenirs" id="navMem"></a>
      <a href="#videos" id="navVid"></a>
      <a href="#mots" id="navMsg"></a>
      <button type="button" id="navLetter"></button>
    </nav>
  </header>

  <button class="icon-btn music-btn" id="musicBtn" type="button" aria-label="Activer ou couper la musique" hidden></button>

  <main id="top">

    <!-- Accueil -->
    <section class="hero" id="hero" aria-labelledby="heroName">
      <div class="hero-photo" id="heroPhoto" aria-hidden="true"></div>
      <div class="hero-glow" aria-hidden="true"></div>

      <div class="hero-copy">
        <h1 class="hero-name" id="heroName"></h1>
        <p class="hero-tag" id="heroTag"></p>
        <p class="hero-text" id="heroText"></p>
        <div class="hero-actions">
          <a class="btn primary" href="#souvenirs" id="ctaMem"></a>
          <button class="btn ghost" type="button" id="ctaLetter"></button>
        </div>
      </div>

      <div class="stage-wrap">
        <div class="stage" id="stage" role="group" aria-label="Galerie de photos en 3D. Fais glisser pour la faire tourner.">
          <div class="ring" id="ring"></div>
        </div>
        <div class="stage-ctrl">
          <button class="icon-btn" type="button" id="ringPrev" aria-label="Photo précédente"></button>
          <button class="icon-btn" type="button" id="ringNext" aria-label="Photo suivante"></button>
        </div>
      </div>
    </section>

    <!-- Photos -->
    <section class="shelf" id="souvenirs" aria-labelledby="photosTitle">
      <div class="shelf-head">
        <div>
          <h2 id="photosTitle"></h2>
          <p id="photosIntro"></p>
        </div>
        <div class="shelf-ctrl">
          <button class="icon-btn" type="button" id="photoPrev" aria-label="Défiler vers la gauche"></button>
          <button class="icon-btn" type="button" id="photoNext" aria-label="Défiler vers la droite"></button>
        </div>
      </div>
      <div class="track" id="photoTrack"></div>
    </section>

    <!-- Vidéos -->
    <section class="shelf shelf-videos" id="videos" aria-labelledby="videosTitle">
      <div class="shelf-head">
        <div>
          <h2 id="videosTitle"></h2>
          <p id="videosIntro"></p>
        </div>
        <div class="shelf-ctrl">
          <button class="icon-btn" type="button" id="videoPrev" aria-label="Défiler vers la gauche"></button>
          <button class="icon-btn" type="button" id="videoNext" aria-label="Défiler vers la droite"></button>
        </div>
      </div>
      <div class="track" id="videoTrack"></div>
    </section>

    <!-- Messages -->
    <section class="voices" id="mots" aria-labelledby="msgTitle">
      <div class="voices-head"><h2 id="msgTitle"></h2></div>
      <div class="tabs" id="tabs" role="tablist" aria-orientation="vertical"></div>
      <div class="quote" id="quotePanel" role="tabpanel" tabindex="0">
        <p class="quote-text" id="quoteText"></p>
        <p class="quote-who" id="quoteWho"></p>
      </div>
    </section>

    <!-- Fin -->
    <section class="finale" aria-labelledby="finaleTitle">
      <h2 id="finaleTitle"></h2>
      <p id="finaleText"></p>
      <button class="btn ghost" type="button" id="replay"></button>
      <p class="credit" id="credit"></p>
    </section>
  </main>

  <!-- Visionneuse photo -->
  <dialog class="lb" id="lb" aria-label="Photo agrandie">
    <button class="icon-btn lb-close" type="button" id="lbClose" aria-label="Fermer"></button>
    <button class="icon-btn lb-nav prev" type="button" id="lbPrev" aria-label="Photo précédente"></button>
    <figure>
      <img id="lbImg" alt="">
      <figcaption>
        <p class="lb-title" id="lbTitle"></p>
        <p class="lb-count" id="lbCount"></p>
      </figcaption>
    </figure>
    <button class="icon-btn lb-nav next" type="button" id="lbNext" aria-label="Photo suivante"></button>
  </dialog>

  <!-- Lecteur vidéo -->
  <dialog class="vd" id="vd" aria-label="Lecteur vidéo">
    <button class="icon-btn lb-close" type="button" id="vdClose" aria-label="Fermer"></button>
    <div class="vd-box">
      <div id="vdWrap"></div>
      <p class="lb-title" id="vdTitle"></p>
    </div>
  </dialog>

  <!-- Lettre -->
  <dialog class="letter-dlg" id="letterDlg" aria-labelledby="letterGreeting">
    <button class="icon-btn letter-close" type="button" id="letterClose" aria-label="Fermer la lettre"></button>
    <article class="letter-paper">
      <h2 id="letterGreeting"></h2>
      <div id="letterBody"></div>
      <p class="letter-sign" id="letterSign"></p>
    </article>
  </dialog>

  <script src="config.js"></script>
  <script src="media.js"></script>
  <script src="script.js"></script>
</body>
</html>
